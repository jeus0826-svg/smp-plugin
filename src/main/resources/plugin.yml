name: SMP
main: com.example.smp.Main
version: 1.32.0
api-version: '1.19'
author: SMP
commands:
  teamset:
    description: 지정한 플레이어들을 같은 팀으로 배정합니다
    permission: smp.admin
    usage: /teamset <팀장> <팀원1> [팀원2] ...
  teamleader:
    description: 게임 시작 전 팀장을 변경합니다
    permission: smp.admin
    usage: /teamleader <현재팀장> <새팀장>
  teamclear:
    description: 수동 팀 배정을 해제합니다
    permission: smp.admin
    usage: /teamclear <팀원>
  startgame:
    description: SMP 게임을 시작 또는 초기화합니다
    permission: smp.admin
  beacontp:
    description: 30분마다 한 번 소속 신호기 근처로 이동합니다
  buybeacon:
    description: 구매할 때마다 다이아몬드 10개씩 증가하는 가격으로 신호기를 구매합니다
  teamstorage:
    description: 팀원끼리 공유하는 54칸 창고를 엽니다
    usage: /teamstorage
    aliases: [teamchest, 팀창고]
permissions:
  smp.admin:
    description: SMP 관리자 권한
    default: op
